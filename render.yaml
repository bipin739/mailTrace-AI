services:
  - type: web
    name: mailtrace-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: mailtrace-db
          property: connectionString
      - key: LLM_ENABLED
        value: "false"
      - key: LLM_PROVIDER
        value: mock
      - key: RATE_LIMIT_ENABLED
        value: "true"

databases:
  - name: mailtrace-db
    plan: free
    region: singapore
    databaseName: mailtrace
    user: mailtrace
